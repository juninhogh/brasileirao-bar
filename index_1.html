<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasileirão Bar</title>
<meta name="theme-color" content="#0f1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brasileirão Bar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0f1a17; overflow: hidden; }
  iframe {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #0f1a17;
  }
</style>
</head>
<body>
<iframe id="app" title="Brasileirão Bar" allow="fullscreen"></iframe>
<script>
  // Link do app no Apps Script. Se um dia fizer uma implantação nova com outro link, troque só aqui.
  var APP = 'https://script.google.com/macros/s/AKfycbwZMzV6HOz9kszSUEXzvTOU_PNZVKd1PJ1qvNVeeuL2SYFDm80DXgymQ05kAtH_h6M/exec';
  // Repassa parâmetros como ?tv=1 para o app
  document.getElementById('app').src = APP + location.search;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
